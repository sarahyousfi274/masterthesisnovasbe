[browser]
gatherUsageStats = false

[theme]
base = "light"
primaryColor = "#2D6A4F"
backgroundColor = "#F4EFE6"
secondaryBackgroundColor = "#FFFDF8"
textColor = "#14231C"
font = "sans serif"

[client]
toolbarMode = "minimal"

[server]
# Round 4, A1: a session whose connection drops (locked phone, laptop asleep)
# is kept for an hour instead of two minutes. Reloads are covered by ?r=.
disconnectedSessionTTL = 3600
