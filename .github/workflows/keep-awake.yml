# Opens the app every 6 hours and wakes it up if it sleeps.
# Opening the welcome page stores nothing.
name: Keep the app awake

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  visit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install a headless browser
        run: |
          pip install playwright==1.48.0
          python -m playwright install --with-deps chromium
      - name: Open the app and wake it if it sleeps
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          URL = "https://decisions-in-founding.streamlit.app/"
          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()
              page.goto(URL, timeout=120000)
              page.wait_for_timeout(10000)
              wake = page.get_by_role("button", name="Yes, get this app back up!")
              if wake.count():
                  wake.first.click()
                  page.wait_for_timeout(90000)
                  print("The app was asleep and has been woken up.")
              else:
                  print("The app was awake.")
              browser.close()
          PY
